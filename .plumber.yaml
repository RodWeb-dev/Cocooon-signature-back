# Plumber configuration (https://github.com/getplumber/plumber)
# Generated by: plumber config init

version: "2.0"
gitlab:
  controls:
    containerImageMustNotUseForbiddenTags:
      enabled: true
      tags:
      - latest
      - dev
      - development
      - staging
      - main
      - master
      containerImagesMustBePinnedByDigest: false
    containerImageMustComeFromAuthorizedSources:
      enabled: true
      trustedUrls:
      - docker.io/mariadb:*
      - docker.io/traefik:*
      - docker.io/library/mariadb:*
      - docker.io/library/traefik:*
      - docker.io/docker:*
      - docker.io/getplumber/plumber:*
      - getplumber/plumber:*
      - docker.io/getplumber/plumber@sha256:*
      - $CI_REGISTRY_IMAGE:*
      - $CI_REGISTRY_IMAGE/*
      - $CI_REGISTRY/*
      - ${CI_REGISTRY}/*
      - ${CI_REGISTRY_IMAGE}:*
      - ${CI_REGISTRY_IMAGE}/*
      - ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/*
      - registry.gitlab.com/security-products/*
      - registry.gitlab.com/gitlab-org/*
      - registry.gitlab.com/pipeline-components/*
      - docker.io/curlimages/*
      - docker.io/alpine/*
      - docker.io/golangci/*
      - docker.io/koalaman/*
      - docker.io/hadolint/*
      - docker.io/semgrep/*
      - docker.io/sonarsource/*
      - docker.io/cypress/*
      - docker.io/gittools/*
      - docker.io/renovate/*
      - docker.io/gitlab/*
      - docker.io/lycheeverse/*
      - docker.io/hugomods/*
      - docker.io/fsfe/*
      - docker.io/hashicorp/*
      - docker.io/cimg/*
      - docker.io/circleci/*
      - docker.io/amazon/*
      - docker.io/google/*
      - docker.io/nvidia/*
      - docker.io/bitnami/*
      - docker.io/redhat/*
      - docker.io/opensuse/*
      - docker.io/gentoo/*
      - docker.io/nixos/*
      - docker.io/rustlang/*
      - mcr.microsoft.com/dotnet/*
      - mcr.microsoft.com/playwright/*
      - mcr.microsoft.com/playwright
      - quay.io/buildah/*
      - quay.io/podman/*
      - quay.io/containers/*
      - quay.io/centos/*
      - quay.io/pypa/*
      - quay.io/gnome_infrastructure/*
      - ghcr.io/astral-sh/*
      - ghcr.io/renovatebot/*
      - ghcr.io/containerbase/*
      - ghcr.io/canonical/*
      - ghcr.io/graalvm/*
      - ghcr.io/terraform-linters/*
      - ghcr.io/prefix-dev/*
      - gcr.io/kaniko-project/*
      - gcr.io/go-containerregistry/*
      - gcr.io/google.com/cloudsdktool/*
      trustDockerHubOfficialImages: true
    branchMustBeProtected:
      enabled: true
      namePatterns:
      - develop
      - main
      defaultMustBeProtected: true
      allowForcePush: false
      codeOwnerApprovalRequired: false
      minMergeAccessLevel: 40
      minPushAccessLevel: 50
    includesMustBeUpToDate:
      enabled: true
    includesMustNotUseForbiddenVersions:
      enabled: true
      forbiddenVersions:
      - latest
      - ~latest
      - main
      - master
      - HEAD
      defaultBranchIsForbiddenVersion: false
    pipelineMustNotEnableDebugTrace:
      enabled: true
      forbiddenVariables:
      - CI_DEBUG_TRACE
      - CI_DEBUG_SERVICES
    pipelineMustNotUseUnsafeVariableExpansion:
      enabled: true
      dangerousVariables:
      - CI_MERGE_REQUEST_TITLE
      - CI_MERGE_REQUEST_DESCRIPTION
      - CI_COMMIT_MESSAGE
      - CI_COMMIT_TITLE
      - CI_COMMIT_TAG_MESSAGE
      - CI_COMMIT_REF_NAME
      - CI_COMMIT_REF_SLUG
      - CI_COMMIT_BRANCH
      - CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      - CI_EXTERNAL_PULL_REQUEST_SOURCE_BRANCH_NAME
    securityJobsMustNotBeWeakened:
      enabled: true
      securityJobPatterns:
      - '*-sast'
      - secret_detection
      - container_scanning
      - '*_dependency_scanning'
      - gemnasium-*
      - dast
      - dast_*
      - license_scanning
      allowFailureMustBeFalse:
        enabled: false
      rulesMustNotBeRedefined:
        enabled: false
      whenMustNotBeManual:
        enabled: false
    pipelineMustNotExecuteUnverifiedScripts:
      enabled: true
    pipelineMustNotOverrideJobVariables:
      enabled: true
      variables:
      - SECURE_ANALYZERS_PREFIX
      - SAST_DISABLED
      - SAST_EXCLUDED_PATHS
      - SAST_EXCLUDED_ANALYZERS
      - SECRET_DETECTION_DISABLED
      - SECRET_DETECTION_EXCLUDED_PATHS
      - CONTAINER_SCANNING_DISABLED
      - DAST_DISABLED
      - DEPENDENCY_SCANNING_DISABLED
      - LICENSE_SCANNING_DISABLED
    pipelineMustNotUseDockerInDocker:
      enabled: true
      detectInsecureDaemon: true
